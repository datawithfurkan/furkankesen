<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Furkan Kesen - connect on LinkedIn, GitHub, or by email."
    />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:title" content="Furkan Kesen" />
    <meta
      property="og:description"
      content="Connect with Furkan Kesen on LinkedIn, GitHub, or by email."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Furkan Kesen</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --line: #dbe3ef;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 32rem),
          linear-gradient(135deg, #f8fafc 0%, #eef4ff 48%, #ffffff 100%);
        color: var(--text);
      }

      main {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(1rem, 5vw, 2rem);
      }

      .profile {
        width: 100%;
        max-width: 34rem;
        min-width: 0;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: clamp(1.5rem, 5vw, 3rem);
      }

      .avatar {
        width: 6rem;
        height: 6rem;
        display: block;
        margin-bottom: 2rem;
        border-radius: 50%;
        border: 3px solid #ffffff;
        background: var(--line);
        box-shadow: 0 14px 34px rgba(15, 23, 42, 0.18);
        object-fit: cover;
        object-position: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 11vw, 4.7rem);
        line-height: 0.95;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      h1 span {
        display: block;
      }

      .email {
        display: inline-block;
        margin: 1.25rem 0 2rem;
        color: var(--muted);
        font-size: clamp(1rem, 3vw, 1.15rem);
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .actions {
        display: grid;
        gap: 0.75rem;
        min-width: 0;
      }

      .button {
        width: 100%;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 3.75rem;
        padding: 0 1.1rem 0 1.2rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease,
          background 180ms ease;
      }

      .button:hover,
      .button:focus-visible {
        border-color: rgba(37, 99, 235, 0.55);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.14);
        transform: translateY(-1px);
        outline: none;
      }

      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .button.primary:hover,
      .button.primary:focus-visible {
        background: var(--accent-dark);
        border-color: var(--accent-dark);
      }

      .button.github {
        background: var(--text);
        border-color: var(--text);
        color: #ffffff;
      }

      .button.github:hover,
      .button.github:focus-visible {
        background: #020617;
        border-color: #020617;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
      }

      .button svg {
        width: 1.25rem;
        height: 1.25rem;
        flex: 0 0 auto;
      }

      .button-icons {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        flex: 0 0 auto;
      }

      .brand-icon {
        width: 1.15rem;
        height: 1.15rem;
      }

      @media (max-width: 420px) {
        main {
          padding: 1rem;
        }

        .profile {
          padding: 1.25rem;
        }

        h1 {
          font-size: clamp(2.35rem, 12vw, 3.4rem);
        }

        .avatar {
          width: 5.5rem;
          height: 5.5rem;
          margin-bottom: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="profile" aria-labelledby="name">
        <img
          class="avatar"
          src="assets/profile.jpg"
          alt="Portrait of Furkan Kesen"
          width="96"
          height="96"
        />
        <h1 id="name">
          <span>Furkan</span>
          <span>Kesen</span>
        </h1>
        <a class="email" data-contact="email-display" href="mailto:imfurkankesen@gmail.com">
          imfurkankesen@gmail.com
        </a>
        <div class="actions" aria-label="Contact options">
          <a
            class="button primary"
            data-contact="linkedin"
            href="https://www.linkedin.com/in/furkankesen/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>LinkedIn</span>
            <span class="button-icons" aria-hidden="true">
              <svg class="brand-icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5ZM.28 8.25h4.44V23H.28V8.25Zm7.25 0h4.25v2.02h.06c.59-1.12 2.04-2.3 4.2-2.3 4.49 0 5.32 2.95 5.32 6.79V23h-4.43v-7.31c0-1.74-.03-3.99-2.43-3.99-2.43 0-2.8 1.9-2.8 3.86V23H7.53V8.25Z"
                />
              </svg>
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                <path
                  d="M7 17 17 7M9 7h8v8"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </a>
          <a
            class="button github"
            data-contact="github"
            href="https://github.com/datawithfurkan"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>GitHub</span>
            <span class="button-icons" aria-hidden="true">
              <svg class="brand-icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.38-1.33-1.75-1.33-1.75-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.49.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23.96-.27 1.98-.4 3-.4s2.04.14 3 .4c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.22.69.83.57C20.56 22.3 24 17.8 24 12.5 24 5.87 18.63.5 12 .5Z"
                />
              </svg>
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                <path
                  d="M7 17 17 7M9 7h8v8"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </a>
          <a class="button" data-contact="email-button" href="mailto:imfurkankesen@gmail.com">
            <span>Email</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path
                d="M4.75 6.75h14.5v10.5H4.75z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <path
                d="m5.25 7.25 6.75 5 6.75-5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
