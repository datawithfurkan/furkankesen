<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Furkan Kesen - connect on LinkedIn or by email."
    />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:title" content="Furkan Kesen" />
    <meta
      property="og:description"
      content="Connect with Furkan Kesen on LinkedIn or by email."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Furkan Kesen</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --line: #dbe3ef;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 32rem),
          linear-gradient(135deg, #f8fafc 0%, #eef4ff 48%, #ffffff 100%);
        color: var(--text);
      }

      main {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(1rem, 5vw, 2rem);
      }

      .profile {
        width: 100%;
        max-width: 34rem;
        min-width: 0;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: clamp(1.5rem, 5vw, 3rem);
      }

      .avatar {
        width: 4.25rem;
        height: 4.25rem;
        display: grid;
        place-items: center;
        margin-bottom: 2rem;
        border-radius: 50%;
        background: var(--text);
        color: #ffffff;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 11vw, 4.7rem);
        line-height: 0.95;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      h1 span {
        display: block;
      }

      .email {
        display: inline-block;
        margin: 1.25rem 0 2rem;
        color: var(--muted);
        font-size: clamp(1rem, 3vw, 1.15rem);
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .actions {
        display: grid;
        gap: 0.75rem;
        min-width: 0;
      }

      .button {
        width: 100%;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 3.75rem;
        padding: 0 1.1rem 0 1.2rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease,
          background 180ms ease;
      }

      .button:hover,
      .button:focus-visible {
        border-color: rgba(37, 99, 235, 0.55);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.14);
        transform: translateY(-1px);
        outline: none;
      }

      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .button.primary:hover,
      .button.primary:focus-visible {
        background: var(--accent-dark);
        border-color: var(--accent-dark);
      }

      .button svg {
        width: 1.25rem;
        height: 1.25rem;
        flex: 0 0 auto;
      }

      @media (max-width: 420px) {
        main {
          padding: 1rem;
        }

        .profile {
          padding: 1.25rem;
        }

        h1 {
          font-size: clamp(2.35rem, 12vw, 3.4rem);
        }

        .avatar {
          margin-bottom: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="profile" aria-labelledby="name">
        <div class="avatar" aria-hidden="true">FK</div>
        <h1 id="name">
          <span>Furkan</span>
          <span>Kesen</span>
        </h1>
        <a class="email" data-contact="email-display" href="mailto:imfurkankesen@gmail.com">
          imfurkankesen@gmail.com
        </a>
        <div class="actions" aria-label="Contact options">
          <a
            class="button primary"
            data-contact="linkedin"
            href="https://www.linkedin.com/in/furkankesen/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>LinkedIn</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path
                d="M7 17 17 7M9 7h8v8"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
          <a class="button" data-contact="email-button" href="mailto:imfurkankesen@gmail.com">
            <span>Email</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path
                d="M4.75 6.75h14.5v10.5H4.75z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <path
                d="m5.25 7.25 6.75 5 6.75-5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
